#   ProbabilityEnum.certain: jistá

Situation:
  overallSeverity:
    ndic: "Zatím se neuvádí. Prvek je v profilu ponechán pro případné rozlišení závažnosti výstrah z meteohlásek (úrovně low, medium, high); odběratel s ním má počítat jako s nepovinným."
