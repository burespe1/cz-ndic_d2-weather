cs:
  perex: 'Tento dokument popisuje datový formát, používaný pro poskytování výstrah před nebezpečnými povětrnostními podmínkami a zhoršenou sjízdností, které zjistí meteohlásky na silniční síti – například husté mlhy, silného větru, náledí nebo intenzivních srážek. Výstraha vzniká při překročení stanoveného prahu, platí 20 minut a dokud jev trvá, průběžně se obnovuje. Poloha se uvádí odkazem na předdefinovaný úsek meteohlásky ze sady poloh formátu cz-ndic_d2-pls. Formát vychází z publikace SituationPublication modelu DATEX II 3.7; pravidelně měřená data meteostanic neobsahuje.'
  keywords: DATEX II, NDIC, SituationPublication
en:
  perex: 'This document describes the data format used to provide warnings of hazardous weather and poor driving conditions detected by road weather stations – for example dense fog, strong wind, ice or heavy precipitation. A warning is created when a measured value exceeds a defined threshold, is valid for 20 minutes and is renewed while the phenomenon lasts. The location is given by a reference to the predefined section of the weather station in the location set of the format cz-ndic_d2-pls. The format is based on the SituationPublication of the DATEX II 3.7 model; it does not contain regularly measured weather data.'
  keywords: DATEX II, NDIC, SituationPublication
